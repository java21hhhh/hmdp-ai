server:
  port: 8082

spring:
  application:
    name: hmdp-ai

  ai:
    openai:
      # DeepSeek 的 OpenAI 兼容端点。
      #
      # ⚠️ 末尾不要带 /v1 —— Spring AI 会自己拼上 /v1/chat/completions,
      #    写成 https://api.deepseek.com/v1 会变成 /v1/v1/chat/completions,直接 404。
      #    (这个坑和百炼是同一个,见 bili-rag 的笔记)
      base-url: https://api.deepseek.com

      # key 从环境变量读,不写在文件里 —— 免得哪天连文件一起提交到 Gitee。
      # 启动脚本「启动.bat」里会 set 这个变量。
      api-key: ${DEEPSEEK_API_KEY}

      chat:
        options:
          # DeepSeek 的模型名。deepseek-chat 是长期别名,指向它当前最新的对话模型。
          # 如果想用推理模型,换成 deepseek-reasoner(更贵、更慢,但推理更强)。
          model: deepseek-chat

          # 温度:0 最死板、1 最发散。
          # 推荐类任务希望它"说得自然但别乱编",0.7 是个温和的中间值。
          # 想让它更稳定可复现,调低到 0.2~0.3 试试 —— 这是你自己可以玩的旋钮。
          temperature: 0.7

# 我们要调用的 hmdp 后端地址(它跑在 8081,nginx 是 8080,别搞混)
hmdp:
  base-url: http://localhost:8081

hmdp-ai:
  # ★ 调用方必须带的钥匙 ★
  #
  # 这个服务每被调一次就烧一次 DeepSeek 的钱,不能让任何人随便调。
  # 所以每个请求都要在头里带上 X-Api-Key,对不上就 401。
  #
  # 同样从环境变量读,不写死在文件里 —— 免得连文件一起进 Gitee。
  # 启动脚本「启动.bat」里 set HMDP_AI_API_KEY=随便一串够长的随机字符。
  #
  # ⚠️ 没配的话服务【起不来】(见 ApiKeyFilter 的构造器) —— 这是故意的。
  #    宁可起不来,也不要"以为保护了、其实裸奔"。
  api-key: ${HMDP_AI_API_KEY:}

logging:
  level:
    com.hxr.hmdpai: DEBUG
